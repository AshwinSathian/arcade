name: Bug report
description: Something in the arcade looks or behaves wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari 26
    validations:
      required: true
  - type: dropdown
    id: lights
    attributes:
      label: Lights
      options: [Day, Night, Both]
  - type: dropdown
    id: hall
    attributes:
      label: Did the 3D hall load?
      description: Without WebGL 2 the page shows a photograph of the hall instead.
      options: [Yes, "No, I saw the photograph", Not sure]
  - type: textarea
    id: media
    attributes:
      label: Screenshot or recording
      description: Drag files here.
