version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Major versions change APIs; they are upgraded by hand, with a look at the site, not by a bot.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
